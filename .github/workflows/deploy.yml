name: Publicação e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Executar testes e verificar cobertura
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/template-pi-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/template-pi-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Configurar acesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Implantar na EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$AWS_USER@$AWS_HOST" \
            "cd /opt/template-pi && \
             IMAGE_TAG=$IMAGE_TAG docker compose pull api && \
             IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans && \
             for tentativa in \$(seq 1 24); do \
               if curl --fail --silent http://localhost:8080/itens >/dev/null; then \
                 docker compose ps; \
                 exit 0; \
               fi; \
               sleep 5; \
             done; \
             docker compose logs --tail=100 api; \
             exit 1"
